name: Collect daily snapshots

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Append one snapshot per validator
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/collect-daily.mjs
      - name: Commit the new day
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/by-vote
          if git diff --cached --quiet; then
            echo "No new snapshots."
          else
            git commit -m "Add the daily validator snapshots."
            git push
          fi
